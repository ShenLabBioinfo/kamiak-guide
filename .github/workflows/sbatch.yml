name: hello world sbatch

on:
  push:
    branches:
      - '**'

jobs:
  hello-world-sbatch:
    runs-on: self-hosted
    steps:
      - run: |
          sbatch <<'EOF'
          #!/bin/bash
          #SBATCH --job-name=github-actions
          #SBATCH --ntasks=1
          #SBATCH --cpus-per-task=1

          echo "hello world from $(hostname)"
          EOF